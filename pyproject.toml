[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-variants-mla"
version = "0.1.0"
description = "MHA, GQA, MQA and DeepSeek Multi-head Latent Attention (MLA) with decoupled RoPE from scratch: absorbed-matrix decoding verified exact, KV-cache bytes per token vs language-modelling loss."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["torch>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "E731"]
